[workspace]
resolver = "2"
members = ["crates/maele-jev", "crates/maele-core"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/frikkao/maele"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
indexmap = { version = "2", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls"] }
clap = { version = "4", features = ["derive"] }
thiserror = "2"
directories = "6"
